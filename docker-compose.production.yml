services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_RETENTION_DAYS: 7
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data/outputs:/app/data/outputs
    depends_on:
      - redis

  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: celery -A worker.celery_app worker --loglevel=INFO
    volumes:
      - ./backend/data/outputs:/app/data/outputs
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  redis-data:
